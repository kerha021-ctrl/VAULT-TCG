    azMsg=`🎁 ¡Te tocó <b>${esc(pk.name)}</b>!`;const go=()=>{if(view=='azar'&&ov.hidden)openPack(pk,true);else grantPack(pk)};
    if(view=='azar'&&az=='wh'){render();wheelStars(bestCol(pk));masReact(good?'happy':'sad');setTimeout(go,2800)}else go()},5700)}
function grantPack(pk){const pool=pk.ids.map(id=>S.cards.find(c=>c.id==id)).filter(Boolean);if(!pool.length)return;draw(pool).forEach(c=>S.inv.push({i:uid(),c:c.id,b:{}}));recount();save();hdr();toast('🎡 Sobre «'+pk.name+'» abierto: 5 cartas a tu colección')}
function wheelStars(col){const d=$('.disc');if(!d)return;const r=d.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;for(let w=0;w<5;w++)setTimeout(()=>{for(let k=0;k<12;k++){const a=Math.random()*6.283;stars(cx+Math.cos(a)*r.width/2*(.85+Math.random()*.3),cy+Math.sin(a)*r.height/2*(.85+Math.random()*.3),1,col,70)}},w*320);navigator.vibrate&&navigator.vibrate([30,40,60])}
/* --- tragaperras --- */
function thumb(c){if(thumbs[c.id]!==undefined)return;thumbs[c.id]='';const im=new Image();im.onload=()=>{try{const cv=document.createElement('canvas');cv.width=96;cv.height=134;cv.getContext('2d').drawImage(im,0,0,96,134);thumbs[c.id]=cv.toDataURL('image/webp',.8)}catch(e){}if(slS&&slS.rf){slS.rf.forEach(r=>r.idx=[-1,-1,-1,-1,-1]);slotDraw()}};im.src=c.src}
const symHTML=c=>{const t=thumbs[c.id];return`<div class="rcb" style="--sc:${RC[rkOf(c)]}">${t?`<img src="${t}" alt="">`:'<span class="rph"></span>'}<i class="rn">${ovr(c)}</i></div>`};
function slotView(){const SL=S.az.sl,its=sitems(),tot=its.reduce((a,o)=>a+Math.max(0,+o.w||0),0)||1;
  let h;
  if(its.length<2)h=`<div class="empty" style="margin:26px 0">La tragaperras aún no está configurada.${adm?'<br>Añade al menos 2 cartas abajo.':''}</div>`;
  else{const bub=`<b>🎰 Probabilidad de las cartas</b><span><i style="font-style:normal">Premio por tirada</i><i style="font-style:normal">${Math.round(SL.pw*10)/10}%</i></span>${its.map(o=>`<span><i style="font-style:normal">${esc(o.card.name)}</i><i style="font-style:normal">${Math.round(SL.pw*Math.max(0,+o.w||0)/tot*10)/10}%</i></span>`).join('')}`;
    h=`<div class="slotm" id="slm"><div class="slt">🎰 TRAGAPERRAS 🎰</div><div class="sbulbs">${'<i></i>'.repeat(14)}</div><div class="sbody"><div class="sreels">${[0,1,2].map(r=>`<div class="reel" data-a="rstop" data-r="${r}"><div class="rwin" id="rw${r}"></div></div>`).join('')}<div class="payl"></div></div><div class="lever" id="lev" data-a="lever"><div class="rail"></div><div class="arm" id="arm"><i class="knob"></i></div></div></div><div class="sinfo">3 iguales = ¡carta de premio! · 🪙${SL.cost} por tirada</div><div style="text-align:center"><button class="bt" data-a="lever" id="lbt">Jalar palanca</button></div></div>${mascotRow('slmsg',slMsg,bub)}`}
  return h+(adm?slotCfg(tot)+bgCfg():'')}
function slotCfg(tot){const SL=S.az.sl;
  return`<h3>⚙ Tragaperras (admin)</h3><div class="row"><span style="flex:1">Costo por tirada 🪙</span><input type="number" min="0" data-f="scost" value="${SL.cost}" style="width:90px"></div><div class="row"><span style="flex:1">Probabilidad de premio (3 iguales) %</span><input type="number" min="0" max="100" data-f="spw" value="${SL.pw}" style="width:90px"></div>${SL.items.map((it,i)=>`<div class="rw"><select data-f="sitem" data-i="${i}" data-k="c" style="flex:1;min-width:0">${S.cards.map(c=>`<option value="${c.id}" ${it.c==c.id?'selected':''}>${esc(c.name)} · ${RN[rkOf(c)]}</option>`).join('')}</select><input type="number" min="0" data-f="sitem" data-i="${i}" data-k="w" value="${it.w}" style="width:64px"><small style="width:52px;text-align:right">${Math.round(SL.pw*Math.max(0,+it.w||0)/tot*10)/10}%</small><button class="x" data-a="sdel" data-i="${i}">✕</button></div>`).join('')}<button class="bt g" data-a="sadd" style="width:100%;margin-top:8px">+ Añadir carta de premio</button><p style="color:var(--mu);font-size:12px">El porcentaje de cada carta es la probabilidad de que salga como premio en una tirada. Si no hay premio, los rodillos nunca muestran 3 iguales.</p>`}
function slotDecide(its,pw){const idx=its.map((o,i)=>({i,w:o.w}));if(Math.random()*100<Math.max(0,Math.min(100,+pw||0))){const w=pickW(idx,o=>o.w).i;return{t:[w,w,w],jack:true}}let t,k=0;do{t=[0,1,2].map(()=>pickW(idx,o=>Math.max(.0001,+o.w||0)).i);k++}while(t[0]==t[1]&&t[1]==t[2]&&k<60);if(t[0]==t[1]&&t[1]==t[2])t[2]=(t[2]+1)%its.length;return{t,jack:false}}
function azPost(){if(az=='sl')slotInit()}
function slotInit(){const its=sitems();if(its.length<2||!$('#rw0'))return;its.forEach(o=>thumb(o.card));slS={items:its,run:false,tm:[],rf:[]};
  for(let r=0;r<3;r++){const win=$('#rw'+r),cells=[0,1,2,3,4].map(()=>{const d=document.createElement('div');d.className='rc';win.appendChild(d);return d}),L=12;slS.rf.push({pos:Math.random()*L,mode:'idle',L,ring:Array.from({length:L},()=>Math.floor(Math.random()*its.length)),cells,idx:[-1,-1,-1,-1,-1],spd:0})}
  slotDraw()}
function slotDraw(){if(!slS||!slS.rf)return;slS.rf.forEach(r=>{const f=Math.floor(r.pos),fr=r.pos-f;r.cells.forEach((c,k)=>{const ix=r.ring[(((f+k)%r.L)+r.L)%r.L];if(r.idx[k]!==ix){r.idx[k]=ix;c.innerHTML=symHTML(slS.items[ix].card)}c.style.transform=`translateY(${(k-1-fr)*100}%)`})})}
function slotPull(){if(!slS||slS.run||azBusy)return;const SL=S.az.sl;if(S.coins<SL.cost)return toast('Monedas insuficientes (🪙'+SL.cost+')');
  S.coins-=SL.cost;const out=slotDecide(slS.items,SL.pw);
  if(out.jack){const c=slS.items[out.t[0]].card;S.inv.push({i:uid(),c:c.id,b:{}});recount()}
  save();hdr();slS.out=out;slS.run=true;slS.last=0;azBusy=true;slMsg='';
  const m=$('#slm');if(m)m.classList.remove('win');const a=$('#arm');if(a){a.classList.remove('pull');a.getBoundingClientRect();a.classList.add('pull')}
  const lb=$('#lbt');if(lb)lb.disabled=true;const mg2=$('#slmsg');if(mg2)mg2.textContent='👆 Toca cada rodillo para detenerlo';
  slS.rf.forEach((r,i)=>{r.mode='spin';r.spd=15+i*1.4;r.tgt=out.t[i];document.querySelectorAll('.reel')[i].classList.remove('lk');document.querySelectorAll('.reel')[i].classList.add('rsp')});
  [1900,2800,3700].forEach((ms,i)=>slS.tm.push(setTimeout(()=>reelStop(i),ms)));slS.raf=requestAnimationFrame(slotTick);navigator.vibrate&&navigator.vibrate(30)}
function reelStop(i){if(!slS||!slS.run)return;const r=slS.rf[i];if(!r||r.mode!='spin')return;const end=Math.ceil(r.pos)+4;r.ring[(((end+2)%r.L)+r.L)%r.L]=r.tgt;r.mode='stopping';r.p0=r.pos;r.end=end;r.t0=performance.now();r.dur=Math.max(520,Math.min(1100,(end-r.pos)/r.spd*1000*1.8))}
function slotTick(now){if(!slS||!slS.run)return;const dt=Math.min(.05,(now-(slS.last||now))/1000);slS.last=now;let live=0;
  slS.rf.forEach((r,i)=>{if(r.mode=='spin'){r.pos+=r.spd*dt;live++}else if(r.mode=='stopping'){const k=Math.min(1,(now-r.t0)/r.dur),c1=1.1,c3=c1+1,e=1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2);r.pos=r.p0+(r.end-r.p0)*e;if(k>=1){r.pos=r.end;r.mode='done';const el=document.querySelectorAll('.reel')[i];if(el){el.classList.remove('rsp');el.classList.add('lk')}navigator.vibrate&&navigator.vibrate(12)}else live++}});
  slotDraw();if(live)slS.raf=requestAnimationFrame(slotTick);else slotEnd()}
function slotEnd(){if(!slS)return;slS.run=false;azBusy=false;const o=slS.out,c=slS.items[o.t[0]].card;
  if(o.jack){const m=$('#slm');if(m)m.classList.add('win');slMsg='🎰 ¡JACKPOT! Ganaste <b>'+esc(c.name)+'</b>';masReact('happy');const e=$('#slmsg');if(e)e.innerHTML=slMsg;setTimeout(()=>{rkOf(c)>=7?legend(c,()=>jpFx(c)):jpFx(c)},500)}
  else{masReact('sad');slMsg='Sin premio · ¡inténtalo otra vez!';const e=$('#slmsg');if(e)e.textContent=slMsg;const lb=$('#lbt');if(lb)lb.disabled=false}}
function slotHalt(){if(!slS||!slS.run)return;slS.run=false;azBusy=false;cancelAnimationFrame(slS.raf);slS.tm.forEach(clearTimeout);if(slS.out&&slS.out.jack)toast('🎰 Ganaste: '+slS.items[slS.out.t[0]].card.name+' (ya está en tu colección)')}
function jpFx(c){const col=RC[rkOf(c)],el=document.createElement('div');el.className='jp';el.style.setProperty('--rc',col);
  el.innerHTML=`<div class="cn-rays" style="opacity:.35;animation:spn 20s linear infinite"></div><h2 class="jpt">🎰 ¡JACKPOT!</h2><div class="jpc">${cardEl(c,{up:1,sm:1})}</div><p>¡Ganaste <b>${esc(c.name)}</b>!</p><button class="bt">Continuar</button>`;document.body.appendChild(el);
  let n=0;const iv=setInterval(()=>{n++;const k=el.querySelector('.card');if(!k)return;const r=k.getBoundingClientRect();stars(r.left+r.width/2,r.top+r.height/2,16,col,240);if(n>14)clearInterval(iv)},260);navigator.vibrate&&navigator.vibrate([40,40,80]);
  el.querySelector('button').onclick=()=>{clearInterval(iv);el.remove();render()}}
const PS=window.PRESET;
if(PS){const ch=S.pv!==PS.ts;if(ch){const old={};S.packs.forEach(p=>old[p.id]=p);S.cards=PS.cards;S.tags=PS.tags||[];S.snd=PS.snd||{};S.az=PS.az||S.az;S.packs=PS.packs.map(p=>Object.assign({},p,{t0:old[p.id]?old[p.id].t0:(p.dur>0?Date.now():null)}));if(!S.order||!S.order.length)S.order=PS.order||[];S.pv=PS.ts;save()}
  (async()=>{for(const k in PS.media){try{if(ch||!(await vget(k)))await vput(k,d2b(PS.media[k]))}catch(e){}}})()}
S.cards.forEach(c=>{if(!c.s)c.s=defS();c.tags=c.tags||[]});
if(!S.inv){S.inv=[];Object.keys(S.col).forEach(cid=>{for(let n=0;n<S.col[cid];n++)S.inv.push({i:uid(),c:cid,b:{}})})}
S.inv=S.inv.filter(x=>S.cards.some(c=>c.id==x.c));recount();
if(!S.v){S.v=1;S.coins=Math.max(S.coins,1000);save()}
if(window.CSS&&CSS.registerProperty){try{CSS.registerProperty({name:'--sw',syntax:'<angle>',inherits:false,initialValue:'0deg'});document.documentElement.classList.add('sw')}catch(e){}}
azInit();render();
setInterval(()=>{if(view=='packs'&&ov.hidden)render()},60000);
</script></body></html>
